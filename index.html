<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jadwal Kuliah</title>
  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      margin: 20px;
      background-color: #ffffff;
      color: #000000;
    }

    .kotak {
      max-width: 720px;
      border: 1px solid #555555;
      padding: 10px 15px 20px 15px;
    }

    h1 {
      font-size: 40px;
      font-weight: bold;
      color: #B00020;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 2px;
      font-size: 20px;
    }

    caption {
      font-size: 22px;
      margin-bottom: 6px;
    }

    th, td {
      border: 1px solid #555555;
      padding: 4px 6px;
      text-align: left;
    }

    th {
      background-color: #FFF176;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="kotak">
    <hr>

    <h1>Jadwal Kuliah</h1>

    <table>
      <caption>Jadwal Kuliah Semester 1</caption>
      <thead>
        <tr>
          <th>Hari</th>
          <th>Jam</th>
          <th>Mata Kuliah</th>
          <th>Ruangan</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Senin</td>
          <td>08:00 - 10:00</td>
          <td>Pemrograman Web</td>
          <td>1A</td>
        </tr>
        <tr>
          <td>Selasa</td>
          <td>10:00 - 12:00</td>
          <td>Basis Data</td>
          <td>1A</td>
        </tr>
        <tr>
          <td>Kamis</td>
          <td>08:00 - 10:00</td>
          <td>Algoritma</td>
          <td>1A</td>
        </tr>
        <tr>
          <td>Jumat</td>
          <td>13:00 - 15:00</td>
          <td>Sistem Operasi</td>
          <td>1A</td>
        </tr>
        <tr>
          <td colspan="3">Kegiatan Mahasiswa</td>
          <td>ruangan kelas</td>
        </tr>
      </tbody>
    </table>

    <hr>
  </div>

</body>
</html>
